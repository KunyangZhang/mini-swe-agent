name: Durable harness regression
on:
  push:
    branches: [feat/durable-harness]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MSWEA_SILENT_STARTUP: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r evidence/requirements-tested.txt && python -m pip install --no-deps -e .
      - run: ruff check src/minisweagent/agents/durable.py src/minisweagent/harness src/minisweagent/run/extra/durable.py tests/harness
      - run: pytest tests/harness tests/agents/test_default.py tests/environments/test_local.py -q
      - run: python -m tests.harness.evaluate --output /tmp/recovery-report.json
      - run: python -m tests.harness.benchmark --repeats 2 --workers 2 --output /tmp/repeated-recovery.json
